<main class="w-screen h-screen flex md:flex-row flex-col">
    <div class="w-[15%] flex md:flex-col flex-row pt-4 pl-6">

        <div class="flex flex-col pt-10 w-full color-[var(--color-brown)]">
            <button class="flex w-full cursor-pointer">

                <div class="bg-[var(--color-terracotta)] text-[var(--color-white)] rounded-full ml-auto w-[23px]">
                    1
                </div>
            </button>
            <button class="flex w-full mt-6 cursor-pointer">
                <img src="./images/icon-house.svg" alt="icon-house">
                <p class="pl-3 font-semibold text-xs">The house</p>
                <!--<div class="bg-[var(--color-terracotta)] text-[var(--color-white)] rounded-full ml-auto w-[23px]">
                    1
                </div> -->
            </button>
            <button class="flex w-full mt-6 cursor-pointer">
                <img src="./images/icon-pin.svg" alt="icon-pin">
                <p class="pl-3 font-semibold text-xs">Around town</p>
                <!--<div class="bg-[var(--color-terracotta)] text-[var(--color-white)] rounded-full ml-auto w-[23px]">
                    1
                </div> -->
            </button>
            <button class="flex w-full mt-6 cursor-pointer">
                <img src="./images/icon-breakfast-outline.svg" alt="icon-breakfast">
                <p class="pl-3 font-semibold text-xs">Breakfast</p>
                <!--<div class="bg-[var(--color-terracotta)] text-[var(--color-white)] rounded-full ml-auto w-[23px]">
                    1
                </div> -->
            </button>
            <button class="flex w-full mt-6 cursor-pointer">
                <img src="./images/icon-mail.svg" alt="icon-mail">
                <p class="pl-3 font-semibold text-xs">Messages</p>
                <!--<div class="bg-[var(--color-terracotta)] text-[var(--color-white)] rounded-full ml-auto w-[23px]">
                    1
                </div> -->
            </button>
        </div>

        <div class="flex flex-col mt-auto">
            <div class="flex w-[100%] h-full bg-[var(--color-yellow)] rounded-xl mb-[20px] overflow-hidden py-3 ps-2">
                <div class="flex flex-col w-[70%] mt-2">
                    <p class="font-thin text-xs uppercase">Today in Cassis</p>
                    <h3 class="font-fraunces font-semibold text-[40px]">27°</h3>

                </div>

                <p class="uppercase font-thin text-xs">Maison Soleil • 12 RUE DES Oliviers • Cassis</p>
                <p class="uppercase font-thin text-xs">© 2026 Maison Soleil</p>

        </div>

    <div class="w-[85%] flex md:flex-col flex-row px-14 pt-4 pb-6">
